name: T3R0ZA smoke test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Import library API
        run: python -c "from spluspy import Robot, Button, filters; print('SplusPy API import OK')"
      - name: Import app modules
        env:
          BOT_TOKEN: "123456:TEST_TOKEN"
          PORT: "10000"
        run: python -c "import database, game_engine, menu; print('Project modules import OK')"
